<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT 요청 서비스 · 로그인</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login-wrap">
    <form class="login-card" id="form" autocomplete="off">
      <div>
        <div class="eyebrow">IT 헬프데스크</div>
        <h1>IT 요청 서비스</h1>
        <p class="sub">사용자 ID를 입력하면 내 자산 정보를 바탕으로 문의를 도와드립니다.</p>
      </div>
      <div class="field">
        <label for="uid">사용자 ID</label>
        <input id="uid" name="user_id" inputmode="numeric" maxlength="16" placeholder="예: 1" autofocus required>
        <span class="hint">데모 계정: 1 (김지원), 2 (이도윤)</span>
      </div>
      <button class="btn" id="submit" type="submit">로그인</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById("form");
    const err = document.getElementById("err");
    const btn = document.getElementById("submit");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: document.getElementById("uid").value.trim() }),
        });
        if (res.ok) { location.href = "/chat"; return; }
        const data = await res.json().catch(() => ({}));
        err.textContent = typeof data.detail === "string" ? data.detail : "로그인에 실패했습니다. ID를 확인해 주세요.";
      } catch (_) {
        err.textContent = "서버에 연결할 수 없습니다.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
